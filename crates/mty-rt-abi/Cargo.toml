[package]
name = "mty-rt-abi"
version = "0.1.0"
edition = "2021"
description = "Real bumpalo-backed runtime-ABI symbols (mty_runtime_*) for built Mighty binaries."

[lib]
name = "mty_rt_abi"
crate-type = ["staticlib"]

[dependencies]
base64 = "0.22"
blake3 = { version = "1", default-features = false, features = ["std"] }
bumpalo = "3"
hex = "0.4"
hmac = "0.12"
libloading = "0.8"
sha2 = "0.10"
